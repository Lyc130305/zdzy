<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>灵境主页 · 自定义仪表板</title>
    <!-- 使用现代、清爽的字体与图标库 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 40%, #0f172a 100%);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            padding: 24px 20px;
            color: #f1f5f9;
        }

        /* 动态背景光晕装饰 */
        body::before {
            content: '';
            position: fixed;
            top: -30%;
            left: -20%;
            width: 120%;
            height: 120%;
            background: radial-gradient(circle at 30% 20%, rgba(56, 189, 248, 0.15), transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        /* 主容器 */
        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        /* 玻璃卡片样式 */
        .glass-card {
            background: rgba(15, 25, 45, 0.55);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.3);
            transition: all 0.2s ease;
        }

        /* 头部区域 */
        .hero-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 32px;
            padding: 20px 28px;
        }

        .greeting-area h1 {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: -0.3px;
            background: linear-gradient(to right, #eef2ff, #bae6fd);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .greeting-area p {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-top: 6px;
        }

        .datetime-area {
            text-align: right;
        }

        #currentTime {
            font-size: 2.1rem;
            font-weight: 700;
            font-feature-settings: 'tnum';
            letter-spacing: 1px;
        }

        #currentDate {
            font-size: 0.9rem;
            color: #cbd5e1;
            margin-top: 6px;
        }

        /* 搜索栏模块 */
        .search-wrapper {
            margin-bottom: 40px;
        }

        .search-card {
            padding: 20px 28px;
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
            justify-content: space-between;
        }

        .search-engine-select {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 2rem;
            padding: 8px 16px;
            color: white;
            font-weight: 500;
            font-size: 0.85rem;
            cursor: pointer;
            outline: none;
            backdrop-filter: blur(4px);
        }

        .search-engine-select option {
            background: #1e293b;
        }

        .search-input-group {
            flex: 1;
            display: flex;
            gap: 10px;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 60px;
            padding: 4px 4px 4px 20px;
            border: 1px solid rgba(255,255,255,0.2);
            transition: all 0.2s;
        }

        .search-input-group:focus-within {
            border-color: #38bdf8;
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.3);
            background: rgba(0, 0, 0, 0.5);
        }

        #searchInput {
            background: transparent;
            border: none;
            flex: 1;
            padding: 12px 0;
            font-size: 1rem;
            color: white;
            outline: none;
        }

        #searchInput::placeholder {
            color: #94a3b8;
        }

        .search-btn {
            background: #38bdf8;
            border: none;
            border-radius: 50px;
            width: 44px;
            height: 44px;
            color: #0f172a;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .search-btn:hover {
            background: #7dd3fc;
            transform: scale(0.96);
        }

        /* 网格布局：快捷方式 & 小组件 */
        .grid-layout {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 28px;
            margin-bottom: 32px;
        }

        /* 快捷链接卡片 */
        .links-section {
            padding: 24px;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-left: 3px solid #38bdf8;
            padding-left: 14px;
        }

        .bookmark-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 16px;
        }

        .bookmark-item {
            background: rgba(255,255,255,0.05);
            border-radius: 1.2rem;
            padding: 12px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: all 0.2s;
            border: 1px solid transparent;
            cursor: pointer;
            text-decoration: none;
            color: #e2e8f0;
        }

        .bookmark-item:hover {
            background: rgba(56, 189, 248, 0.2);
            border-color: rgba(56, 189, 248, 0.5);
            transform: translateY(-3px);
        }

        .bookmark-icon {
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        .bookmark-title {
            font-size: 0.8rem;
            font-weight: 500;
        }

        .bookmark-url {
            font-size: 0.65rem;
            color: #7e8aa2;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .add-link-btn {
            margin-top: 20px;
            background: rgba(255,255,255,0.05);
            border: 1px dashed rgba(255,255,255,0.3);
            border-radius: 2rem;
            padding: 10px;
            width: 100%;
            color: #cbd5e1;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .add-link-btn:hover {
            background: rgba(56, 189, 248, 0.2);
            border-color: #38bdf8;
            color: white;
        }

        /* 日历组件 & 备忘 */
        .calendar-notes {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .calendar-card, .notes-card {
            padding: 20px;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .month-year {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .nav-buttons button {
            background: rgba(255,255,255,0.1);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 40px;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }

        .nav-buttons button:hover {
            background: #38bdf8;
            color: #0f172a;
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            margin-bottom: 12px;
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .calendar-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }

        .cal-day {
            background: rgba(255,255,255,0.03);
            border-radius: 40px;
            padding: 8px 0;
            text-align: center;
            font-size: 0.85rem;
            cursor: default;
            transition: 0.1s;
        }

        .cal-day.today {
            background: #38bdf8;
            color: #0f172a;
            font-weight: 700;
            box-shadow: 0 0 6px #38bdf8;
        }

        .cal-day.other-month {
            opacity: 0.4;
        }

        /* 便签本 */
        .notes-card textarea {
            width: 100%;
            background: rgba(0,0,0,0.35);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 1.2rem;
            padding: 14px;
            color: white;
            font-size: 0.9rem;
            font-family: inherit;
            resize: vertical;
            outline: none;
        }

        .notes-card textarea:focus {
            border-color: #38bdf8;
        }

        .save-note {
            margin-top: 12px;
            background: transparent;
            border: 1px solid #38bdf8;
            border-radius: 2rem;
            padding: 8px 16px;
            color: #bae6fd;
            cursor: pointer;
            transition: 0.2s;
            width: fit-content;
        }

        .save-note:hover {
            background: #38bdf8;
            color: #0f172a;
        }

        /* 页脚与额外自定义 */
        .footer-credit {
            text-align: center;
            font-size: 0.75rem;
            color: #5b6e8c;
            margin-top: 40px;
        }

        /* 弹窗样式 (新增书签) */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }

        .modal.active {
            visibility: visible;
            opacity: 1;
        }

        .modal-content {
            background: #1e293b;
            border-radius: 2rem;
            max-width: 400px;
            width: 90%;
            padding: 28px;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 30px 40px rgba(0,0,0,0.5);
        }

        .modal-content h3 {
            margin-bottom: 20px;
        }

        .modal-content input {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 1rem;
            color: white;
            outline: none;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .modal-actions button {
            padding: 8px 18px;
            border-radius: 2rem;
            border: none;
            cursor: pointer;
        }

        .btn-confirm {
            background: #38bdf8;
            color: #0f172a;
        }

        .btn-cancel {
            background: #334155;
            color: #e2e8f0;
        }

        @media (max-width: 700px) {
            .hero-section {
                flex-direction: column;
                align-items: flex-start;
            }
            .datetime-area {
                text-align: left;
            }
            .bookmark-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            }
        }
    </style>
</head>
<body>
<div class="dashboard">
    <!-- 顶部问候与时间 -->
    <div class="glass-card hero-section">
        <div class="greeting-area">
            <h1 id="greetingText">下午好，探索者</h1>
            <p><i class="fas fa-globe"></i> 你的专属主页 · 随心定制</p>
        </div>
        <div class="datetime-area">
            <div id="currentTime">--:--:--</div>
            <div id="currentDate">----年--月--日</div>
        </div>
    </div>

    <!-- 统一搜索栏 -->
    <div class="search-wrapper">
        <div class="glass-card search-card">
            <select id="engineSelect" class="search-engine-select">
                <option value="https://www.google.com/search?q=">Google</option>
                <option value="https://www.bing.com/search?q=">Bing</option>
                <option value="https://www.baidu.com/s?wd=">Baidu</option>
                <option value="https://duckduckgo.com/?q=">DuckDuckGo</option>
                <option value="https://github.com/search?q=">GitHub</option>
            </select>
            <div class="search-input-group">
                <input type="text" id="searchInput" placeholder="搜索网页或直接输入网址..." autocomplete="off">
                <button id="searchBtn" class="search-btn"><i class="fas fa-search"></i></button>
            </div>
        </div>
    </div>

    <!-- 主要内容网格：快捷方式 + 右侧日历与笔记 -->
    <div class="grid-layout">
        <!-- 左侧书签模块 (可增删改) -->
        <div class="glass-card links-section">
            <div class="section-title">
                <i class="fas fa-thumbtack"></i> 快捷导航
                <span style="font-size: 0.7rem; margin-left: auto;">点击访问 · 可自定义</span>
            </div>
            <div id="bookmarkContainer" class="bookmark-grid">
                <!-- 动态渲染书签列表 -->
            </div>
            <div class="add-link-btn" id="addBookmarkBtn">
                <i class="fas fa-plus-circle"></i> 添加自定义链接
            </div>
        </div>

        <!-- 右侧区域: 日历 + 备忘录 -->
        <div class="calendar-notes">
            <div class="glass-card calendar-card">
                <div class="calendar-header">
                    <span class="month-year" id="monthYearDisplay">2025年1月</span>
                    <div class="nav-buttons">
                        <button id="prevMonthBtn"><i class="fas fa-chevron-left"></i></button>
                        <button id="nextMonthBtn"><i class="fas fa-chevron-right"></i></button>
                    </div>
                </div>
                <div class="weekdays">
                    <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
                </div>
                <div id="calendarDaysContainer" class="calendar-days"></div>
            </div>

            <div class="glass-card notes-card">
                <div class="section-title" style="border-left-color: #10b981;"><i class="fas fa-pen-fancy"></i> 随心备忘</div>
                <textarea id="noteContent" rows="4" placeholder="写点想法、待办事项或者今日灵感... 内容会自动保存到本地"></textarea>
                <button id="saveNoteBtn" class="save-note"><i class="fas fa-save"></i> 保存笔记</button>
                <div style="font-size: 0.7rem; margin-top: 10px; opacity:0.6;"><i class="fas fa-database"></i> 自动存入浏览器</div>
            </div>
        </div>
    </div>
    <div class="footer-credit">
        <i class="fas fa-magic"></i> 自定义主页 · 点击书签或添加你的最爱 · 时间与日历伴你同行
    </div>
</div>

<!-- 新增书签模态框 -->
<div id="bookmarkModal" class="modal">
    <div class="modal-content">
        <h3><i class="fas fa-link"></i> 添加快捷链接</h3>
        <input type="text" id="modalLinkName" placeholder="名称 (例如: 知乎)" autocomplete="off">
        <input type="text" id="modalLinkUrl" placeholder="网址 (https://...)" autocomplete="off">
        <div class="modal-actions">
            <button class="btn-cancel" id="cancelModalBtn">取消</button>
            <button class="btn-confirm" id="confirmBookmarkBtn">确认添加</button>
        </div>
    </div>
</div>

<script>
    // ---------- 1. 时间 & 日期动态刷新 ----------
    function updateDateTime() {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2,'0');
        const day = String(now.getDate()).padStart(2,'0');
        const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
        const weekday = weekdays[now.getDay()];
        document.getElementById('currentDate').innerText = `${year}.${month}.${day} ${weekday}`;
        
        let hours = now.getHours();
        const minutes = String(now.getMinutes()).padStart(2,'0');
        const seconds = String(now.getSeconds()).padStart(2,'0');
        const timeStr = `${String(hours).padStart(2,'0')}:${minutes}:${seconds}`;
        document.getElementById('currentTime').innerText = timeStr;
        
        // 动态问候
        const greeting = document.getElementById('greetingText');
        if (hours < 6) greeting.innerText = '🌙 夜深了，注意休息';
        else if (hours < 12) greeting.innerText = '☀️ 早上好，一日之计';
        else if (hours < 18) greeting.innerText = '📖 下午好，灵感充沛';
        else greeting.innerText = '✨ 晚上好，自在时刻';
    }
    setInterval(updateDateTime, 1000);
    updateDateTime();

    // ---------- 2. 书签管理 localStorage 核心 ----------
    let bookmarks = [];

    // 默认书签数据（优雅入门）
    const defaultBookmarks = [
        { name: "GitHub", url: "https://github.com", icon: "fab fa-github" },
        { name: "Gmail", url: "https://mail.google.com", icon: "fas fa-envelope" },
        { name: "YouTube", url: "https://youtube.com", icon: "fab fa-youtube" },
        { name: "知乎", url: "https://zhihu.com", icon: "fab fa-zhihu" },
        { name: "Reddit", url: "https://reddit.com", icon: "fab fa-reddit-alien" },
        { name: "Bilibili", url: "https://bilibili.com", icon: "fas fa-tv" }
    ];

    function loadBookmarks() {
        const stored = localStorage.getItem('custom_home_bookmarks');
        if (stored) {
            bookmarks = JSON.parse(stored);
        } else {
            bookmarks = [...defaultBookmarks];
            saveBookmarks();
        }
        renderBookmarks();
    }

    function saveBookmarks() {
        localStorage.setItem('custom_home_bookmarks', JSON.stringify(bookmarks));
    }

    // 简单图标回退：如果没有配置icon则根据url或默认
    function getIconClass(bookmark) {
        if (bookmark.icon) return bookmark.icon;
        // 简单启发式分配
        const name = bookmark.name.toLowerCase();
        if (name.includes('git')) return 'fab fa-github';
        if (name.includes('mail')) return 'fas fa-envelope';
        if (name.includes('you') || name.includes('tube')) return 'fab fa-youtube';
        if (name.includes('bili')) return 'fas fa-tv';
        return 'fas fa-link';
    }

    function renderBookmarks() {
        const container = document.getElementById('bookmarkContainer');
        if (!container) return;
        container.innerHTML = '';
        bookmarks.forEach((bm, index) => {
            const iconClass = getIconClass(bm);
            const div = document.createElement('div');
            div.className = 'bookmark-item';
            div.setAttribute('data-index', index);
            div.innerHTML = `
                <div class="bookmark-icon"><i class="${iconClass}"></i></div>
                <div class="bookmark-title">${escapeHtml(bm.name)}</div>
                <div class="bookmark-url">${bm.url.replace(/^https?:\/\//, '').substring(0, 28)}</div>
            `;
            // 点击访问
            div.addEventListener('click', (e) => {
                e.stopPropagation();
                window.open(bm.url, '_blank');
            });
            // 右键删除 (高级自定义)
            div.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                if (confirm(`是否删除书签「${bm.name}」？`)) {
                    bookmarks.splice(index, 1);
                    saveBookmarks();
                    renderBookmarks();
                }
            });
            container.appendChild(div);
        });
        if(bookmarks.length === 0){
            const emptyMsg = document.createElement('div');
            emptyMsg.style.gridColumn = '1/-1';
            emptyMsg.style.textAlign = 'center';
            emptyMsg.style.padding = '20px';
            emptyMsg.style.opacity = '0.7';
            emptyMsg.innerText = '✨ 点击下方添加你的专属链接';
            container.appendChild(emptyMsg);
        }
    }

    function addBookmark(name, url) {
        if (!name.trim() || !url.trim()) return false;
        // 简易url协议修复
        let finalUrl = url.trim();
        if (!finalUrl.startsWith('http://') && !finalUrl.startsWith('https://')) {
            finalUrl = 'https://' + finalUrl;
        }
        bookmarks.push({ name: name.trim(), url: finalUrl, icon: '' });
        saveBookmarks();
        renderBookmarks();
        return true;
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if(m === '&') return '&amp;';
            if(m === '<') return '&lt;';
            if(m === '>') return '&gt;';
            return m;
        });
    }

    // 模态框控制
    const modal = document.getElementById('bookmarkModal');
    const addBtn = document.getElementById('addBookmarkBtn');
    const cancelModal = document.getElementById('cancelModalBtn');
    const confirmBtn = document.getElementById('confirmBookmarkBtn');
    const linkNameInput = document.getElementById('modalLinkName');
    const linkUrlInput = document.getElementById('modalLinkUrl');

    function openModal() {
        modal.classList.add('active');
        linkNameInput.value = '';
        linkUrlInput.value = '';
    }
    function closeModal() { modal.classList.remove('active'); }
    addBtn.addEventListener('click', openModal);
    cancelModal.addEventListener('click', closeModal);
    confirmBtn.addEventListener('click', () => {
        const name = linkNameInput.value.trim();
        let url = linkUrlInput.value.trim();
        if (!name || !url) {
            alert('请填写名称和网址');
            return;
        }
        addBookmark(name, url);
        closeModal();
    });
    modal.addEventListener('click', (e) => { if(e.target === modal) closeModal(); });

    // ---------- 3. 日历组件 ----------
    let currentCalendarDate = new Date(); // 当前展示的年月
    
    function renderCalendar() {
        const year = currentCalendarDate.getFullYear();
        const month = currentCalendarDate.getMonth(); // 0-11
        const firstDayOfMonth = new Date(year, month, 1);
        const startWeekday = firstDayOfMonth.getDay(); // 0周日
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        
        // 上月遗留日期
        const prevMonthDays = new Date(year, month, 0).getDate();
        const calendarDays = [];
        // 填充上月末尾
        for (let i = startWeekday - 1; i >= 0; i--) {
            calendarDays.push({ day: prevMonthDays - i, isCurrentMonth: false });
        }
        // 当月
        for (let i = 1; i <= daysInMonth; i++) {
            calendarDays.push({ day: i, isCurrentMonth: true });
        }
        // 补足6行 42格
        const remaining = 42 - calendarDays.length;
        for (let i = 1; i <= remaining; i++) {
            calendarDays.push({ day: i, isCurrentMonth: false });
        }
        
        const container = document.getElementById('calendarDaysContainer');
        if (!container) return;
        container.innerHTML = '';
        const today = new Date();
        const todayYear = today.getFullYear();
        const todayMonth = today.getMonth();
        const todayDate = today.getDate();
        
        calendarDays.forEach(cell => {
            const div = document.createElement('div');
            div.className = 'cal-day';
            if (!cell.isCurrentMonth) div.classList.add('other-month');
            let displayDay = cell.day;
            // 标记今天高亮
            if (cell.isCurrentMonth && year === todayYear && month === todayMonth && displayDay === todayDate) {
                div.classList.add('today');
            }
            div.innerText = displayDay;
            container.appendChild(div);
        });
        
        const monthNames = ['一月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '十一月', '十二月'];
        document.getElementById('monthYearDisplay').innerText = `${year}年 ${monthNames[month]}`;
    }
    
    document.getElementById('prevMonthBtn').addEventListener('click', () => {
        currentCalendarDate.setMonth(currentCalendarDate.getMonth() - 1);
        renderCalendar();
    });
    document.getElementById('nextMonthBtn').addEventListener('click', () => {
        currentCalendarDate.setMonth(currentCalendarDate.getMonth() + 1);
        renderCalendar();
    });
    
    // ---------- 4. 备忘录本地存储 ----------
    const noteTextarea = document.getElementById('noteContent');
    const saveNoteBtn = document.getElementById('saveNoteBtn');
    function loadNotes() {
        const savedNote = localStorage.getItem('custom_home_note');
        if (savedNote !== null) {
            noteTextarea.value = savedNote;
        } else {
            noteTextarea.value = '📌 在这里记录你的待办事项、灵感或名言。\n✨ 内容自动保存到浏览器中。';
        }
    }
    function saveNoteToLocal() {
        localStorage.setItem('custom_home_note', noteTextarea.value);
        alert('📝 笔记已保存');
    }
    saveNoteBtn.addEventListener('click', saveNoteToLocal);
    // 自动保存防抖 (可选好体验)
    let autoSaveTimer;
    noteTextarea.addEventListener('input', () => {
        clearTimeout(autoSaveTimer);
        autoSaveTimer = setTimeout(() => {
            localStorage.setItem('custom_home_note', noteTextarea.value);
        }, 800);
    });
    
    // ---------- 5. 搜索引擎功能 ----------
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const engineSelect = document.getElementById('engineSelect');
    
    function performSearch() {
        let query = searchInput.value.trim();
        if (query === "") return;
        // 如果输入看起来像网址 (包含点且无空格) 直接跳转
        if ((query.includes('.') && !query.includes(' ') && !query.startsWith('http')) || query.startsWith('http')) {
            let url = query;
            if (!url.startsWith('http')) url = 'https://' + url;
            window.open(url, '_blank');
            return;
        }
        const engineUrl = engineSelect.value;
        const fullUrl = engineUrl + encodeURIComponent(query);
        window.open(fullUrl, '_blank');
        searchInput.value = '';
    }
    searchBtn.addEventListener('click', performSearch);
    searchInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') performSearch(); });
    
    // ---------- 初始化所有模块 ----------
    loadBookmarks();
    renderCalendar();
    loadNotes();
</script>
</body>
</html>
